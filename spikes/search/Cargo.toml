[package]
name = "search-spike"
description = "S6: local part search (BM25 + embeddings + Rebrickable priors) and encoder comparison"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone: not a member of the cad workspace.
[workspace]

[[bin]]
name = "search-spike"
path = "src/main.rs"

[dependencies]
search = { path = "../../crates/search" }
ldraw = { path = "../../crates/ldraw" }
candle-core = { version = "0.11", features = ["accelerate"] }
candle-nn = { version = "0.11", features = ["accelerate"] }
candle-transformers = { version = "0.11", features = ["accelerate"] }
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
flate2 = "1"
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.12"
libc = "0.2"

[profile.release]
debug = false
