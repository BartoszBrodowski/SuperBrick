[package]
name = "ui-spike"
description = "M0 spike S5: egui_dock shell with two wgpu viewports and a streaming chat panel"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
ldraw = { path = "../../crates/ldraw" }
render = { path = "../../crates/render" }
glam = "0.34"
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "accesskit"] }
egui = "0.36"
egui_dock = "0.21"
egui_commonmark = "0.25"
png = "0.18"
wgpu = "30"

[profile.release]
debug = 1
