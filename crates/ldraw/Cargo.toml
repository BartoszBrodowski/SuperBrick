[package]
name = "ldraw"
description = "LDraw library (zip or folders), colours, geometry flattening and lossless LDR/MPD I/O; a port of bench-next/ldraw.py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
glam.workspace = true
memmap2.workspace = true
miniz_oxide.workspace = true
parking_lot.workspace = true
sha2 = "0.10"
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Console"] }

[dev-dependencies]
serde_json.workspace = true
